---
layout: default
---

<div class="container">

  <article class="entry">

    <header class="entry-header">
      <h1 class="entry-title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="site-description">{{ page.subtitle }}</p>{% endif %}
    </header>

    <div class="entry-content">
      {{ content }}
    </div>

  </article>

</div>
